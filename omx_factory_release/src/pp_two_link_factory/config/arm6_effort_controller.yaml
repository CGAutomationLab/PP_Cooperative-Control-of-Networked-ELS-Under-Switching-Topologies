/arm6/controller_manager:
  ros__parameters:
    update_rate: 200

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    effort_controller:
      type: effort_controllers/JointGroupEffortController

/arm6/joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false

/arm6/effort_controller:
  ros__parameters:
    joints:
      - arm6_joint1
      - arm6_joint2
