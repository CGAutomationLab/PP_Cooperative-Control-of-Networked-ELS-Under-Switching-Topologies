/arm3/controller_manager:
  ros__parameters:
    update_rate: 200

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    effort_controller:
      type: effort_controllers/JointGroupEffortController

/arm3/joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false

/arm3/effort_controller:
  ros__parameters:
    joints:
      - arm3_joint1
      - arm3_joint2
