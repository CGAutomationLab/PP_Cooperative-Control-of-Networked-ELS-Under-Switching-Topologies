/arm5/controller_manager:
  ros__parameters:
    update_rate: 200

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    effort_controller:
      type: effort_controllers/JointGroupEffortController

/arm5/joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false

/arm5/effort_controller:
  ros__parameters:
    joints:
      - arm5_joint1
      - arm5_joint2
